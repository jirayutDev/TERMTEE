# TERMTEE media server: MediaMTX (ingest) + control (ffmpeg + Shaka Packager) + nginx (CDN origin)
# + capture (Chromium page capture for BROWSER inputs).
# Usage: cp .env.example .env && docker compose up -d --build
services:
  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHHTTPADDRESS: http://control:8080/mediamtx/auth?token=${MEDIAMTX_HOOK_TOKEN}
    ports:
      - "${SRT_PUBLIC_PORT:-8890}:8890/udp" # SRT ingest
      - "${RTMP_PUBLIC_PORT:-1935}:1935" # RTMP ingest
    depends_on:
      - control

  control:
    build: ./control
    restart: unless-stopped
    environment:
      PORT: 8080
      MEDIA_CONTROL_SECRET: ${MEDIA_CONTROL_SECRET}
      APP_URL: ${APP_URL}
      CDN_BASE_URL: ${CDN_BASE_URL}
      OUTPUT_DIR: /data/output
      WORK_DIR: /data/work
      MEDIAMTX_HOOK_TOKEN: ${MEDIAMTX_HOOK_TOKEN}
      MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
      MEDIAMTX_READ_USER: ${MEDIAMTX_READ_USER:-packager}
      MEDIAMTX_READ_PASS: ${MEDIAMTX_READ_PASS}
      INGEST_PUBLIC_HOST: ${INGEST_PUBLIC_HOST:-localhost}
      SRT_PUBLIC_PORT: ${SRT_PUBLIC_PORT:-8890}
      RTMP_PUBLIC_PORT: ${RTMP_PUBLIC_PORT:-1935}
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-2}
      TRANSCODE: ${TRANSCODE:-auto}
      PALLYCON_KMS_URL: ${PALLYCON_KMS_URL:-https://kms.pallycon.com/v2/cpix/pallycon/getKey}
      PALLYCON_KMS_TOKEN: ${PALLYCON_KMS_TOKEN:-}
      DRM_DEV_KEY_ID: ${DRM_DEV_KEY_ID:-}
      DRM_DEV_KEY: ${DRM_DEV_KEY:-}
      ALLOW_PRIVATE_INPUT_HOSTS: ${ALLOW_PRIVATE_INPUT_HOSTS:-false}
      CAPTURE_URL: http://capture:8090
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:-}
      BROWSER_BLACK_CHECK_SECONDS: ${BROWSER_BLACK_CHECK_SECONDS:-30}
    volumes:
      - ${MEDIA_DATA_DIR:-./data}/output:/data/output
      - ${MEDIA_DATA_DIR:-./data}/work:/data/work
    ports:
      - "${CONTROL_PORT:-8080}:8080" # control API for the Next.js app
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets APP_URL point at a Next.js dev server on the host
    stop_grace_period: 10s
    networks: [default, capture]

  # BROWSER inputs: Xvfb + PulseAudio + Chromium + ffmpeg (src/capture.ts). Runs untrusted web pages,
  # so it holds no secrets except CAPTURE_TOKEN, lives on its own network (reachable only by control,
  # with internet egress), runs as non-root with no capabilities. No published ports.
  capture:
    build:
      context: ./control
      dockerfile: Dockerfile.capture
    restart: unless-stopped
    init: true # reaps Chromium's helper processes
    environment:
      CAPTURE_PORT: 8090
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:-}
      CAPTURE_MAX_SESSIONS: ${CAPTURE_MAX_SESSIONS:-1}
      CAPTURE_X264_PRESET: ${CAPTURE_X264_PRESET:-veryfast}
      CAPTURE_CRF: ${CAPTURE_CRF:-18}
      CAPTURE_MAXRATE: ${CAPTURE_MAXRATE:-8M}
      CAPTURE_BUFSIZE: ${CAPTURE_BUFSIZE:-16M}
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-2}
      ALLOW_PRIVATE_INPUT_HOSTS: ${ALLOW_PRIVATE_INPUT_HOSTS:-false}
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 1080p30 x264 + Chromium software rendering: give each concurrent session ~4 dedicated cores.
    cpus: ${CAPTURE_CPUS:-4}
    mem_limit: ${CAPTURE_MEM_LIMIT:-3g}
    networks: [capture]
    profiles: [browser] # enabled with COMPOSE_PROFILES=browser (see .env.example)

  origin:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
      NGINX_ENVSUBST_FILTER: APP_ORIGIN
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${MEDIA_DATA_DIR:-./data}/output:/data/output:ro
    ports:
      - "${ORIGIN_PORT:-8081}:80" # CDN origin (put a CDN in front in production)

networks:
  default:
  # Only control and capture: a captured page cannot reach MediaMTX or the origin.
  capture:
